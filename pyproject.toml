[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libigc"
version = "1.1.0" # FIXME: Should probably bump this version?
description = "A library for parsing IGC files and extracting thermals"
readme = "README.md"
license = "MIT"
authors = [{ name = "Suraj Mandal", email = "dev@mandalsuraj.com" }]
requires-python = ">=3.12"
dependencies = ["simplekml>=1.3.1"]
keywords = [
    "igc",
    "paragliding",
    "gliding",
    "soaring",
    "flight-analysis",
    "thermal-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/surajmandalcell/libigc"

[project.optional-dependencies]
dev = ["twine", "bump-my-version", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.bumpversion]
current_version = "1.1.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/libigc/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
