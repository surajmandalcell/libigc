name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Runs the same `make` targets a developer runs, so CI and local checks
    # cannot drift apart. UV_PYTHON pins the interpreter for the whole target.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Lint and test
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Build the wheel and sdist
        run: make build
      - name: Check the artifact metadata twine will upload
        run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
