name: Publish

# Whatever is on master is what gets published. Merging a pull request builds,
# tests and uploads it to PyPI. There is no release to cut and nothing to
# approve.
#
# To ship a new version, bump it in the pull request:
#     make bump-patch    (or bump-minor / bump-major)
# Merge, and this workflow publishes it and tags the commit.
#
# Merges that do not change the version are safe: that version is already on
# PyPI, so the upload is skipped and the run stays green.
#
# Publishing uses PyPI trusted publishing (OpenID Connect). There is no API
# token: PyPI verifies a short-lived identity token minted by GitHub for this
# exact repository, workflow file and environment, so the values registered on
# PyPI must keep matching this file's path and the environment name below.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: Index to upload to
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # `make build` runs clean, lint and the full test suite before it
      # packages anything, so a red tree cannot be published.
      - name: Build the wheel and sdist
        run: make build
      - name: Check the artifact metadata
        run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment is half of what PyPI matches against.
    environment: release
    permissions:
      # Mints the OIDC token PyPI checks. No password, no API token.
      id-token: write
      # Pushes the version tag once the upload succeeds.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      # The upload is attempted up to three times. The action opens its OIDC
      # exchange with a hardcoded five second connect timeout and no retry of
      # its own, so a momentary network blip between the runner and PyPI fails
      # the whole release and needs a human to press re-run. That already
      # happened once:
      #
      #   ConnectTimeout: upload.pypi.org/_/oidc/audience (connect timeout=5)
      #
      # Retrying is safe because `skip-existing` makes the upload idempotent:
      # an attempt that already succeeded is a no-op on the next pass. Only the
      # last attempt is allowed to fail the job, so a real problem, such as a
      # trusted publisher that does not match, still stops the release rather
      # than being retried into a confusing three-times-over failure.

      - name: Publish (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true

      - name: Back off before retrying
        if: steps.attempt1.outcome == 'failure'
        run: sleep 30

      - name: Publish (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true

      - name: Back off before the final attempt
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: sleep 60

      # Not continue-on-error: if this one fails, the release fails.
      - name: Publish (final attempt)
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true

      # An explicit `if` replaces the implicit success() check, so it has to be
      # spelled out, or a failed upload would still get tagged as released.
      - name: Tag the published version
        if: success() && github.event_name == 'push'
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged, nothing to do"
          else
            git tag "v$version"
            git push origin "v$version"
            echo "tagged v$version"
          fi
